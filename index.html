<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6c63ff" />
  <meta name="description" content="Garden Match — a calm, family-friendly mobile puzzle game." />
  <title>Garden Match</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell" aria-live="polite">
    <section class="card hero" id="home-screen">
      <div class="brand-row">
        <div class="logo" aria-hidden="true">🌼</div>
        <div>
          <p class="eyebrow">Everyone-friendly puzzle</p>
          <h1>Garden Match</h1>
        </div>
      </div>
      <p class="intro">Match cheerful garden tiles before your moves run out. No reading speed, no violence, no timers — just relaxing puzzle fun for all ages.</p>

      <div class="settings-grid" aria-label="Game settings">
        <label>
          Board size
          <select id="size-select">
            <option value="6">Easy 6 × 6</option>
            <option value="7" selected>Classic 7 × 7</option>
            <option value="8">Big 8 × 8</option>
          </select>
        </label>
        <label>
          Difficulty
          <select id="difficulty-select">
            <option value="relaxed">Relaxed</option>
            <option value="normal" selected>Normal</option>
            <option value="tricky">Tricky</option>
          </select>
        </label>
      </div>

      <button class="primary" id="start-button">Start Game</button>
      <button class="ghost" id="how-button">How to play</button>
    </section>

    <section class="card game hidden" id="game-screen" aria-label="Garden Match game board">
      <header class="game-header">
        <button class="icon-button" id="back-button" aria-label="Back to menu">‹</button>
        <div>
          <p class="eyebrow">Level <span id="level-label">1</span></p>
          <h2 id="goal-label">Collect flowers</h2>
        </div>
        <button class="icon-button" id="sound-button" aria-label="Toggle sound">🔊</button>
      </header>

      <div class="stats" role="status">
        <div><span id="score-label">0</span><small>Score</small></div>
        <div><span id="moves-label">24</span><small>Moves</small></div>
        <div><span id="target-label">0 / 12</span><small>Goal</small></div>
      </div>

      <div class="board-wrap">
        <div id="board" class="board" aria-label="Puzzle board"></div>
      </div>

      <div class="actions">
        <button class="secondary" id="hint-button">Hint</button>
        <button class="secondary" id="shuffle-button">Shuffle</button>
        <button class="secondary" id="restart-button">Restart</button>
      </div>
    </section>

    <dialog id="message-dialog">
      <form method="dialog" class="dialog-card">
        <h2 id="dialog-title">How to play</h2>
        <p id="dialog-text"></p>
        <menu>
          <button class="primary" id="dialog-action" value="ok">OK</button>
        </menu>
      </form>
    </dialog>
  </main>

  <script src="game.js" defer></script>
</body>
</html>
