<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Garden Match icon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffe4f5"/>
      <stop offset="0.45" stop-color="#ffb0dd"/>
      <stop offset="1" stop-color="#ff86cf"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7fd"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#34d86f"/>
      <stop offset="1" stop-color="#15914a"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#7d2b5d" flood-opacity=".23"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <circle cx="92" cy="96" r="32" fill="#fff" opacity=".6"/>
  <circle cx="424" cy="118" r="20" fill="#fff" opacity=".62"/>
  <path d="M40 362c60-34 125-24 177 0 57 26 118 29 228-28v142H40z" fill="#46c96f" opacity=".78"/>

  <g filter="url(#shadow)">
