    <rect x="102" y="102" width="308" height="308" rx="72" fill="none" stroke="#fff" stroke-width="8" opacity=".8"/>

    <!-- cute flower mascot -->
    <g transform="translate(256 234)">
      <g fill="#ff5fd2">
        <ellipse rx="42" ry="76" transform="translate(0 -92)"/>
        <ellipse rx="42" ry="76" transform="rotate(60) translate(0 -92)"/>
        <ellipse rx="42" ry="76" transform="rotate(120) translate(0 -92)"/>
        <ellipse rx="42" ry="76" transform="rotate(180) translate(0 -92)"/>
        <ellipse rx="42" ry="76" transform="rotate(240) translate(0 -92)"/>
        <ellipse rx="42" ry="76" transform="rotate(300) translate(0 -92)"/>
