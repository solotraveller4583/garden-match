<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Garden Match icon">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff6a6"/>
      <stop offset="0.55" stop-color="#b8f7d4"/>
      <stop offset="1" stop-color="#b7d9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#25314d" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="101" y="101" width="310" height="310" rx="72" fill="#fff" opacity=".88"/>
    <g transform="translate(256 256)">
      <circle r="50" fill="#ffd166"/>
      <g fill="#ff7aa2">
        <ellipse rx="38" ry="78" transform="rotate(0) translate(0 -92)"/>
        <ellipse rx="38" ry="78" transform="rotate(60) translate(0 -92)"/>
        <ellipse rx="38" ry="78" transform="rotate(120) translate(0 -92)"/>
        <ellipse rx="38" ry="78" transform="rotate(180) translate(0 -92)"/>
        <ellipse rx="38" ry="78" transform="rotate(240) translate(0 -92)"/>
        <ellipse rx="38" ry="78" transform="rotate(300) translate(0 -92)"/>
      </g>
      <circle r="42" fill="#ffe97a"/>
    </g>
  </g>
</svg>
