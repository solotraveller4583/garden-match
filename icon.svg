    <path d="M405 68l12 26 28 4-20 19 5 28-25-13-25 13 5-28-20-19 28-4z" fill="#fff" opacity=".9"/>
    <path d="M116 142l8 17 18 3-13 12 3 18-16-9-16 9 3-18-13-12 18-3z" fill="#fff" opacity=".74"/>

    <text x="256" y="394" text-anchor="middle" font-family="Arial Rounded MT Bold, Nunito, Arial, sans-serif" font-size="68" font-weight="900" fill="#5b37d6" letter-spacing="-6">GM</text>
