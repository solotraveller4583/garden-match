<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Garden Match logo">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e6f7a8"/>
      <stop offset="1" stop-color="#d6f0c0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#91b56b" flood-opacity=".18"/>
    </filter>
    <radialGradient id="petal" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#fff6ff"/>
      <stop offset="1" stop-color="#d8c8f7"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#57c45f"/>
      <stop offset="1" stop-color="#2a9f4d"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- flower -->
  <g transform="translate(128 118)">
    <g fill="url(#petal)">
      <ellipse cx="0" cy="-34" rx="20" ry="28"/>
      <ellipse cx="29" cy="-11" rx="20" ry="28" transform="rotate(60 29 -11)"/>
      <ellipse cx="18" cy="24" rx="20" ry="28" transform="rotate(120 18 24)"/>
      <ellipse cx="-18" cy="24" rx="20" ry="28" transform="rotate(240 -18 24)"/>
      <ellipse cx="-29" cy="-11" rx="20" ry="28" transform="rotate(300 -29 -11)"/>
    </g>
    <circle r="18" fill="#ff8e2a"/>
    <circle r="10" fill="#ffe56b"/>
  </g>

  <!-- stem and leaves -->
  <rect x="122" y="136" width="12" height="56" rx="6" fill="url(#stem)"/>
  <path d="M122 162c-14-4-22 2-28 12 10 2 20-1 28-12z" fill="#5ecf73"/>
  <path d="M134 162c14-4 22 2 28 12-10 2-20-1-28-12z" fill="#5ecf73"/>
  <path d="M126 156c-8-6-17-6-26-2 7 5 16 7 26 2z" fill="#72db87" opacity=".95"/>
  <path d="M130 156c8-6 17-6 26-2-7 5-16 7-26 2z" fill="#72db87" opacity=".95"/>
</svg>
