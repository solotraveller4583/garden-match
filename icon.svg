      <circle r="52" fill="#ff8b1f"/>
      <circle r="34" fill="#ffe65a"/>
      <circle cx="-11" cy="-11" r="8" fill="#fff" opacity=".72"/>
      <circle cx="-14" cy="2" r="4.2" fill="#5b3c2f"/>
      <circle cx="14" cy="2" r="4.2" fill="#5b3c2f"/>
      <path d="M-10 18c6 7 16 7 22 0" fill="none" stroke="#5b3c2f" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="-5.5" y="50" width="11" height="74" rx="5.5" fill="url(#stem)"/>
      <ellipse cx="-39" cy="94" rx="28" ry="16" fill="#5dd97b" transform="rotate(-24 -39 94)"/>
      <ellipse cx="39" cy="94" rx="28" ry="16" fill="#5dd97b" transform="rotate(24 39 94)"/>
